aid: launchnotes
name: LaunchNotes
description: >-
  LaunchNotes is a release communication platform for sharing changelogs,
  roadmaps, and deprecation notices. The platform helps product, engineering,
  and customer-facing teams coordinate launches, communicate releases, and
  notify customers about deprecations through a structured publishing
  workflow and an extensible API.
